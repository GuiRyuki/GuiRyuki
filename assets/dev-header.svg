<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Terminal de Guilherme Ryuki</title>
  <desc id="desc">Banner em estilo terminal apresentando Guilherme como estudante de ADS e desenvolvedor em formação</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="52%" stop-color="#0B1530"/>
      <stop offset="100%" stop-color="#15103A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#60A5FA" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="1090" cy="80" r="150" fill="#7C3AED" opacity=".10"/>
  <circle cx="110" cy="365" r="145" fill="#0284C7" opacity=".10"/>

  <rect x="55" y="38" width="1090" height="344" rx="18" fill="#070D1D" stroke="#334155" stroke-width="2"/>
  <rect x="55" y="38" width="1090" height="54" rx="18" fill="#111827"/>
  <path d="M55 92 H1145" stroke="#334155" stroke-width="2"/>
  <circle cx="88" cy="65" r="8" fill="#FB7185"/>
  <circle cx="116" cy="65" r="8" fill="#FBBF24"/>
  <circle cx="144" cy="65" r="8" fill="#4ADE80"/>
  <text x="600" y="72" text-anchor="middle" fill="#94A3B8" font-size="17" font-family="Consolas, Monaco, monospace">guilherme@github — profile.ts</text>

  <g font-family="Consolas, Monaco, monospace" font-size="21">
    <text x="88" y="132" fill="#64748B">01</text>
    <text x="130" y="132" fill="#C084FC">const</text>
    <text x="200" y="132" fill="#E2E8F0"> developer </text>
    <text x="330" y="132" fill="#38BDF8">=</text>
    <text x="354" y="132" fill="#E2E8F0">{</text>

    <text x="88" y="173" fill="#64748B">02</text>
    <text x="165" y="173" fill="#7DD3FC">name:</text>
    <text x="250" y="173" fill="#86EFAC">"Guilherme Ryuki"</text>
    <text x="455" y="173" fill="#E2E8F0">,</text>

    <text x="88" y="214" fill="#64748B">03</text>
    <text x="165" y="214" fill="#7DD3FC">role:</text>
    <text x="250" y="214" fill="#86EFAC">"Estudante de ADS"</text>
    <text x="480" y="214" fill="#E2E8F0">,</text>

    <text x="88" y="255" fill="#64748B">04</text>
    <text x="165" y="255" fill="#7DD3FC">stack:</text>
    <text x="260" y="255" fill="#E2E8F0">[</text>
    <text x="276" y="255" fill="#86EFAC">"C#"</text>
    <text x="326" y="255" fill="#E2E8F0">,</text>
    <text x="350" y="255" fill="#86EFAC">".NET"</text>
    <text x="418" y="255" fill="#E2E8F0">,</text>
    <text x="442" y="255" fill="#86EFAC">"SQL"</text>
    <text x="500" y="255" fill="#E2E8F0">],</text>

    <text x="88" y="296" fill="#64748B">05</text>
    <text x="165" y="296" fill="#7DD3FC">status:</text>
    <text x="274" y="296" fill="#FDE68A">"open_to_internship"</text>

    <text x="88" y="337" fill="#64748B">06</text>
    <text x="130" y="337" fill="#E2E8F0">};</text>
    <rect x="172" y="319" width="12" height="23" rx="2" fill="url(#line)" filter="url(#glow)"/>
  </g>
</svg>